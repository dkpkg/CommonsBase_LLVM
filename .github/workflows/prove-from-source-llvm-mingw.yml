# FEASIBILITY SPIKE (exploratory; NOT a release workflow).
#
# Question: can the llvm-mingw x86_64 cross toolchain be COMPILED FROM SOURCE on the SAME
# manylinux_2_28 image the Linux_x86_64 leg uses (glibc 2.28), within a standard runner's disk
# and time, and does the result run there (glibc <= 2.28) and cross-compile a Windows PE32+ exe?
# Today the cross toolchain is re-hosted from the upstream prebuilt (ubuntu-22.04, glibc ~2.35),
# which will not run on glibc 2.28.
#
# Lives ONLY on the side branch engine-opt/prove-from-source-llvm-mingw and triggers on push to
# it. Writes no package, cuts no tag, touches no distribution file. It is a measurement.
#
# NOTE the destination is passed to build-all.sh as a POSITIONAL, and the script has its own
# internal $PREFIX; naming our env var PREFIX made the script see it pre-set and reject the
# positional as a stray PGO dest. Our var is DEST, and we unset PREFIX before the call.
name: prove-from-source-llvm-mingw

on:
  push:
    branches: [engine-opt/prove-from-source-llvm-mingw]
  workflow_dispatch:

jobs:
  build-x86_64-from-source:
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:2026.04.08-5
    timeout-minutes: 350
    defaults:
      run:
        shell: bash --noprofile --norc -eux {0}
    env:
      LLVM_MINGW_REF: "20251216"
      DEST: /work-fromsrc/llvm-mingw
      SRC: /work-fromsrc/src
    steps:
      - name: Environment and disk baseline (FAST; fails early on a missing floor)
        run: |
          echo "== uname / glibc =="
          uname -a
          ldd --version | sed -n 1p
          echo "== mounts (pick the largest for the build) =="
          df -h || true
          echo "== gcc-toolset =="
          if [ -f /opt/rh/gcc-toolset-14/enable ]; then . /opt/rh/gcc-toolset-14/enable; fi
          gcc --version | sed -n 1p
          g++ --version | sed -n 1p
          BEST=$(df -P / /mnt /__w 2>/dev/null | awk 'NR>1{print $4, $6}' | sort -rn | sed -n 1p | awk '{print $2}')
          echo "chosen build mount: ${BEST:-/}"
          mkdir -p "${BEST:-/}/work-fromsrc"
          ln -sfn "${BEST:-/}/work-fromsrc" /work-fromsrc
          mkdir -p "$SRC" "$(dirname "$DEST")"
          df -h /work-fromsrc

      - name: Install build tools (git, cmake>=3.20, ninja, python) and fail fast if absent
        run: |
          dnf install -y git python3 || true
          PYBIN=$(command -v python3.11 || command -v python3 || echo /opt/python/cp311-cp311/bin/python3)
          "$PYBIN" -m pip install --quiet --upgrade pip
          "$PYBIN" -m pip install --quiet cmake ninja
          SCRIPTS=$("$PYBIN" -c 'import sysconfig;print(sysconfig.get_paths()["scripts"])')
          echo "$SCRIPTS" >> "$GITHUB_PATH"
          export PATH="$SCRIPTS:$PATH"
          git --version
          cmake --version | sed -n 1p
          ninja --version

      - name: Clone upstream llvm-mingw at the re-hosted release tag
        run: |
          cd "$SRC"
          git clone --depth 1 --branch "$LLVM_MINGW_REF" https://github.com/mstorsjo/llvm-mingw
          ls -la llvm-mingw

      - name: Build the x86_64-only cross toolchain from source (the measurement)
        run: |
          if [ -f /opt/rh/gcc-toolset-14/enable ]; then . /opt/rh/gcc-toolset-14/enable; fi
          PYBIN=$(command -v python3.11 || command -v python3)
          export PATH="$("$PYBIN" -c 'import sysconfig;print(sysconfig.get_paths()["scripts"])'):$PATH"
          cd "$SRC/llvm-mingw"
          START=$(date +%s)
          echo "BUILD START $(date -u +%FT%TZ)"
          # DEST is positional; unset PREFIX so build-all.sh does not mistake it for a pre-set one.
          unset PREFIX
          TOOLCHAIN_ARCHS="x86_64" ./build-all.sh "$DEST"
          END=$(date +%s)
          echo "BUILD END $(date -u +%FT%TZ)"
          echo "WALL_SECONDS=$((END-START))"
          echo "== disk after build =="
          df -h /work-fromsrc || true
          du -sh "$DEST" || true
          du -sh "$SRC/llvm-mingw" || true

      - name: Verify glibc floor of the produced driver binaries (<= 2.28 required)
        run: |
          CLANG="$DEST/bin/clang"
          test -x "$CLANG"
          echo "== dynamic deps of the produced clang =="
          ldd "$CLANG" || true
          echo "== max GLIBC_ version the produced clang/lld require =="
          MAXV=$(objdump -T "$DEST/bin/"* 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1 || true)
          echo "MAX_GLIBC_REQUIRED=${MAXV:-none}"
          if [ -n "${MAXV:-}" ]; then
            HI=$(printf '%s\n%s\n' "GLIBC_2.28" "$MAXV" | sort -V | tail -1)
            if [ "$HI" != "GLIBC_2.28" ]; then
              echo "FAIL: produced toolchain requires $MAXV (> 2.28); would not run on the manylinux leg"
              exit 1
            fi
          fi
          echo "OK: produced toolchain requires <= GLIBC_2.28"

      - name: Cross-compile a Windows PE32+ smoke test with the from-source toolchain
        run: |
          printf '#include <stdio.h>\nint main(void){printf("hello from cross\\n");return 0;}\n' > /tmp/hello.c
          "$DEST/bin/x86_64-w64-mingw32-clang" /tmp/hello.c -o /tmp/hello.exe
          file /tmp/hello.exe
          file /tmp/hello.exe | grep -q "PE32+" && echo "OK: produced a PE32+ Windows executable"

      - name: Summarize (peak disk, wall time, glibc floor)
        if: always()
        shell: bash --noprofile --norc -ux {0}
        run: |
          echo "== FINAL SUMMARY =="
          df -h || true
          du -sh "$DEST" 2>/dev/null || echo "(no dest; build did not complete)"
